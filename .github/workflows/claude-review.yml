name: Claude review

# AI code review via anthropics/claude-code-action (v1).
#
# Modes:
#   1. PR auto-review — every non-draft PR opened/pushed gets a fresh
#      Claude review comment.
#   2. Manual re-review — add the `claude:review` label to re-run.
#
# Distinct from claude.yml (the @claude mention bot): this one is
# event-driven, non-interactive.
#
# ENABLE (two steps — kept OFF by default so PRs stay green until set up)
# ----------------------------------------------------------------------
#   1. Add the `CLAUDE_CODE_OAUTH_TOKEN` secret (see claude.yml header;
#      `claude setup-token`), and install the Claude GitHub App on the repo.
#   2. Turn the gate on:
#        gh variable set CLAUDE_REVIEW_ENABLED --body true
#   Until the variable is `true`, the review job is skipped entirely
#   (no failing check on PRs).
#
# Security: uses `pull_request` (not `pull_request_target`), so fork PRs
# cannot access the secret. Untrusted PR fields are only consumed by the
# action as data, never injected into a shell `run:` step.
#
# Failure policy: the review is advisory (non-required check). Two failure
# classes are deliberately swallowed so they don't paint every PR red:
#   - missing token (Dependabot runs never get repo secrets) — probed before
#     the action runs;
#   - Claude subscription usage/spending-cap exhaustion — the OAuth token is
#     a subscription token, and when the cap is hit (e.g. after a heavy local
#     Claude Code day) every review fails in <1s with "Spending cap reached"
#     until the cap resets. That's a quota condition, not a broken review, so
#     the job classifies it post-hoc and succeeds with a notice.
# Any other action failure still fails the check.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-pr:
    name: review PR
    if: |
      vars.CLAUDE_REVIEW_ENABLED == 'true' && (
        (github.event.action == 'labeled' &&
          github.event.label.name == 'claude:review') ||
        (github.event.action != 'labeled' &&
          github.event.pull_request.draft == false)
      )
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # Dependabot-triggered runs never receive repository Actions secrets
      # (GitHub security policy), so CLAUDE_CODE_OAUTH_TOKEN is empty and the
      # action below would hard-fail validation. Probe for the token first and
      # skip the review gracefully when it is absent — the job still succeeds,
      # so the check stays green on dep bumps. Add the token to Dependabot
      # secrets (gh secret set CLAUDE_CODE_OAUTH_TOKEN --app dependabot) to
      # have dependency PRs reviewed too.
      - name: Check token availability
        id: token
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN unavailable (expected on Dependabot PRs); skipping AI review."
          fi

      # v1 of the action: `direct_prompt` became `prompt`, and `model` moved
      # into `claude_args` (--model). track_progress keeps the v0-style
      # tracking comment the review is posted into. Model stays pinned
      # explicitly: the action's built-in default has been retired before
      # (claude-sonnet-4-20250514 404'd and failed every run) — a pinned,
      # current model fails loudly at bump time instead of silently at
      # retirement time. Sonnet 5 is the cost-appropriate model for an
      # advisory PR review (near-Opus quality at Sonnet pricing).
      - name: Claude review
        id: review
        if: steps.token.outputs.available == 'true'
        continue-on-error: true # failures are classified in the next step
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dependabot PRs run as a Bot actor; allow it so dependency
          # bumps still get an AI review.
          allowed_bots: "dependabot"
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a senior frontend engineer would.
            Focus on:
              - Correctness bugs and edge cases the tests miss
              - React pitfalls (stale closures, missing deps, unnecessary
                re-renders, effect cleanup, key misuse)
              - State/store correctness (Zustand selectors, transport
                boundary) and async race conditions
              - Accessibility regressions (roles, labels, keyboard nav)
              - Security issues (input validation, XSS, unsafe HTML)
              - API/contract changes against the engine bindings that
                affect callers
            Skip formatting nits (Prettier enforces those) and lint
            issues (the ESLint job covers those).
            Be concise. If the PR is in great shape, say so plainly
            instead of inventing nits.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Classify a failed review: usage/spending-cap exhaustion on the
      # subscription OAuth token is a quota condition, not a review defect —
      # swallow it (green check + notice). Anything else is a real failure.
      - name: Classify review outcome
        if: steps.token.outputs.available == 'true' && steps.review.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          result=""
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            result=$(jq -r '[.[] | select(.type == "result")] | last | .result // empty' \
              "$EXECUTION_FILE" 2>/dev/null || true)
          fi
          echo "Claude result message: ${result:-<none>}"
          if printf '%s' "$result" | grep -qiE 'spending cap|usage limit|credit balance|rate limit'; then
            echo "::notice::AI review skipped: Claude usage cap reached (\"$result\"). It will resume once the cap resets."
            exit 0
          fi
          echo "::error::Claude review failed for a non-quota reason — see the 'Claude review' step logs."
          exit 1
